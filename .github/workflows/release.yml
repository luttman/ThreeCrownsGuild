name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax and name display
        run: |
          luac5.1 -p ThreeCrownsGuild.lua
          lua5.1 tests/name_display.lua
          lua5.1 tests/forever_only.lua

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CurseForge settings
        shell: bash
        run: |
          if [[ -z "$CF_PROJECT_ID" ]]; then
            echo '::warning::CF_PROJECT_ID is missing. Publishing to GitHub only.'
          elif [[ ! "$CF_PROJECT_ID" =~ ^[1-9][0-9]*$ || -z "$CF_API_KEY" ]]; then
            echo '::error::Set a positive CF_PROJECT_ID variable and a CF_API_KEY secret.'
            exit 1
          fi
      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          args: -g forever -p "${CF_PROJECT_ID:-0}"
